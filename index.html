<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>💰 Expense Tracker</h1>
  
  <div class="container">
    <div class="balance">
      <h2>Your Balance</h2>
      <p id="balance">₹0</p>
    </div>

    <div class="inc-exp">
      <div>
        <h3>Income</h3>
        <p id="income" class="plus">+₹0</p>
      </div>
      <div>
        <h3>Expense</h3>
        <p id="expense" class="minus">-₹0</p>
      </div>
    </div>

    <h3>History</h3>
    <ul id="list" class="list"></ul>

    <h3>Add new transaction</h3>
    <form id="form">
      <input type="text" id="text" placeholder="Enter description" required>
      <input type="number" id="amount" placeholder="Enter amount (positive=income, negative=expense)" required>
      <button type="submit">Add Transaction</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
